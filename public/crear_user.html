<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Agregar</title>
    <link rel="stylesheet" href="crud.css">
</head>
<body>
    <div id="Crear_usuario" class="contenedor">
        <h3>CREAR UNA CUENTA</h3>
        <form id="formLogin">
            <div>  
                <label for="username">Nombre de usuario:</label><br>
                <input type="text" id="username" name="username" required>
            </div>
            <div>  
                <label for="correo">Correo electronico:</label><br>
                <input type="text" id="correo" name="correo" required>
            </div>
            <div>  
                <label for="contrasenia">Contraseña:</label><br>
                <input type="text" id="contrasenia" name="contrasenia" required>
            </div>
            <div>  
                <label for="contrasenia2">Confirmar contraseña:</label><br>
                <input type="text" id="contrasenia2" name="contrasenia2" required>
            </div>
            <button type="submit">Crear usuario</button>
        </form>
    </div>
    <script src="crear_user.js"></script>
</body>
</html>
